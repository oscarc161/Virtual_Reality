<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
      <a-sphere position="0 1 0" phi-start = "0" phi-length = "290" side="double" rotation="90 0 0" color="yellow"></a-sphere>

      <a-box wireframe = "true" position="0.25 1.5 0.95">
      <a-circle position="0 0 0" radius="0.25"></a-circle>
      <a-circle position="0 0 0.001" radius="0.125" color="black"></a-circle>
      </a-box>

      <a-box wireframe = "true" position="0.25 1.5 -0.95" rotation="180 0 0">
      <a-circle position="0 0 0" radius="0.25"></a-circle>
      <a-circle position="0 0 0.001" radius="0.125" color="black"></a-circle>
      </a-box>

    </a-scene>
  </body>
</html>
