<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Goblin Hut-->
      <a-cylinder position=" 0 2.5 0" radius="3" height="5" src="hay.jpg" theta-start="0" theta-length = "270" side="double" open-ended = "true" rotation = "0 45 0" > </a-cylinder>
      <a-cylinder position=" 0 2.3625 0" radius="3" height="0.75" src="hay.jpg" repeat="5 1" theta-start="0" theta-length = "90" side="double" open-ended = "true" rotation = "0 -45 0"></a-cylinder>
          <!-- Window -->
          <a-cylinder position="0 3.87 0" color="#ADD8E6" opacity="0.2"  radius="3" height="2.25" theta-start = "0" theta-length = "90" side="double" open-ended="true" rotation = "0 -45 0"></a-cylinder>
          <!-- Door -->
          <a-entity position="0 0 0">
           <a-cylinder  rotation="0 -45 0" position="0 1 0" color="#964B00" height="2" radius="3" theta-start = "0" theta-length = "90" side="double" open-ended="true"></a-cylinder>
           <a-sphere position= "0.5 1 3.055" color="yellow" radius="0.1"> </a-sphere>
           <a-sphere position= "-0.5 1 3.055" color="yellow" radius="0.1"> </a-sphere>
           <a-box color="black" depth="0.075" width ="0.05" height="2" position="0 1 3"></a-box>
          </a-entity>
          <!-- Straw Roof -->
          <a-entity position="0 0 0">
            <a-cone src="hay.jpg" radius-bottom="4" height="6" position="0 8 0"></a-cone>
          </a-entity>
          <!-- circle floor -->
          <a-circle rotation="-90 0 0" position="0 0.3 0" radius="3" src="floor.jpg"></a-circle>
          <!-- Stone pathway -->
           


      <!-- Planes (floor)-->
      <a-plane position="0 0 0" rotation="-90 0 0" width="7" height="60" src="road.jpg" repeat="1 20" ></a-plane>
      <a-plane position="18.5 0 0" rotation="-90 0 0" width="30" height="60" src="grass.jpg" repeat="20 20" ></a-plane>
      <a-plane position="-13.5 0 0" rotation="-90 0 0" width="20" height="60" src="rock.jpg" ></a-plane>
      <!-- Fences (top and bottom)-->
      <a-box  position = "5 1 30" height="2" depth="0.25" width="57" src="fence.jpg" repeat="10 1"></a-box>
      <a-box  position = "5 1 -30" height="2" depth="0.25" width="57" src="fence.jpg" repeat="10 1"></a-box>
      <!-- Fences (sides)-->
      <a-box  rotation="0 90 0" position = "33.5 1 0" height="2" depth="0.25" width="60" src="fence.jpg" repeat="10 1"></a-box>
      <a-box  rotation="0 90 0" position = "-23.5 1 0" height="2" depth="0.25" width="60" src="fence.jpg" repeat="10 1"></a-box>
      <a-sky src="sky.jpg" ></a-sky>
      <a-camera position="0 4 5" ></a-camera>
    </a-scene>
  </body>
</html>
