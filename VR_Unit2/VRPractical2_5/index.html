<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="script.js"></script>
    <script src="block.js"></script>
    <script src="goblin.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Challenge
             Upload a picture to use as the texture for the walls of your maze if you want  
        -->
        <img src="rock_wall.jpg" id="rocky">
      </a-assets>
      <a-entity rotation="0 0 0" position="-2 0 -3">
        <a-cylinder position="0 1 0" radius="0.1" height="2" color="#BA8C63"></a-cylinder>
        <a-box color="#BA8C63" scale="3 1.5 0.5" position="0 2 0"></a-box>
      <a-text value="Turn right and look around" position="-1.35 2 0.3"></a-text>
    </a-entity>

    <a-entity rotation="0 0 0" position="-5 0 -3" scale="0.7 0.7 0.7" id="goblin">
      <a-cone position = "0.5 6.9 0" radius-bottom="0.5" rotation="0 0 -15" color="#3D7D52" scale="0.5 0.5 0.5" ></a-cone>
      <a-cone position = "-0.5 6.9 0" radius-bottom="0.5" rotation="0 0 15" color="#3D7D52" scale="0.5 0.5 0.5" ></a-cone>
      <a-sphere scale="1 1 1" color="#3D7D52" position="0 5.8 0"></a-sphere>
      <a-sphere scale="1.5 2 1.5" color="#3D7D52" position="0 3 0"></a-sphere>
      <a-cylinder position="-0.5 0 0" radius="0.2" height="3" color="#3D7D52"></a-cylinder>
      <a-cylinder position="0.5 0 0" radius="0.2" height="3" color="#3D7D52"></a-cylinder>

      <a-cylinder position="1 3 0" radius="0.2" height="3" color="#3D7D52" rotation="45 90 0"></a-cylinder>
      <a-cylinder position="-1 3 0" radius="0.2" height="3" color="#3D7D52" rotation="45 90 0"></a-cylinder>
    </a-entity>


      <a-plane position="0 0 0" rotation="-90 0 0" width="150" height="150" color="#AAFFAA"></a-plane>


      
      
      <a-sky color="blue"></a-sky>
      <a-camera position="-2 1.5 0" ></a-camera>
      <a-camera wasd-controls="acceleration: 100; fly: true" position=" -2 1.5 0"></a-camera>
      </a-camera>
</html>
